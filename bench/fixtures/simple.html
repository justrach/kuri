<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Login</title></head>
<body>
<main>
<h1>Sign in</h1>
<form aria-label="Login">
 <label>Username <input type="text" name="user" autocomplete="username"></label>
 <label>Password <input type="password" name="pass" autocomplete="current-password"></label>
 <label><input type="checkbox" name="remember"> Remember me</label>
 <button type="submit">Sign in</button>
 <a href="/forgot">Forgot password?</a>
</form>
</main>
</body></html>
